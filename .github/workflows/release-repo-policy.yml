name: Toolbox Release Channel Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run negative contract regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify locked exact product identity
        run: python3 scripts/verify_release_repo.py
      - name: Check GitHub public release inventory stays empty
        run: python3 scripts/verify_release_repo.py --live
